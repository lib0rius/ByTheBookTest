name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,analysis]"
      - name: Format
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q
