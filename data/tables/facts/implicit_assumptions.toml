# Curated table - implicit assumptions.
#
# true  holds under the conditions everyone takes for granted (base 10, Celsius, sea level,
#       northern hemisphere, flat geometry, 24-hour clock, ...)
# false holds only if one of those conditions changes, without saying so: false in the real world
# traps the same false statement with its condition written: true in the real world
#
# For an UNKNOWN claim the rulebook holds the trap ("One plus one is written as 10 in base 2") and the
# claim is the version without the condition ("One plus one is written as 10"): the rulebook does not say
# which base is used.
category = "implicit_assumptions"

# --- number bases ------------------------------------------------------------------------------

[[row]]
id = "one_plus_one_written"
subject = "one plus one"
true = "is written as 2"
false = ["is written as 10"]
traps = ["is written as 10 in base 2"]

